[server]
port = 8808
houmo_sampling = false

[log]
level = 0
location = C:\ProgramData\HoumoAI\hi_cpp\logs\
open_console_window = true

[model]
cur_model = D:\workspace\houmo_apps\hi.cpp\bin\models\hmm_deepseek_256_4096_4cores_20250317

[llm_params]
#示例如下，请参考下面或者llamacpp的设置
#repeat-penalty = 1.1
#repeat-last-n = 63

[service]
#说明：请认真阅读！
#切换不同的配置，需要把当前相关的配置行加#号注释掉，放开(删掉)新配置的行前面的#号
#USE_CEnglishMixedProcessor 含义： 是否开启中英文混合输出检测，默认0不开启， 1开启
#HICPP_NUM_PARALLEL 含义: 模型并发数，默认1，改成>1的值的话需要加载对应的模型文件
#HICPP_MODEL_PATH 含义:模型文件的路径，

#单batch deepseek 7B的配置
USE_CEnglishMixedProcessor = 0
HICPP_NUM_PARALLEL = 1
##直接加载hmm文件按下面这行设置，非houmo llama.cpp设置HICPP_MODEL_PATH到文件夹
#HICPP_MODEL_PATH = /opt/hicpp/models/DeepSeek-R1-Distill-Qwen-7B-1Batch/4core_8k
##用houmo llama.cpp加载gguf文件用下面的值，需要指定到gguf文件本身
HICPP_MODEL_PATH = /opt/hicpp/models/HiModel-Qwen2.5-7B-4batch-F16-2k-4core-xh1-v0.0.1.gguf

