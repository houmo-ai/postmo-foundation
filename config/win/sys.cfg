[server]
port = 7901
# Comma-separated numeric device IDs. The default selects device 0; for example: 0,1.
devices = 0

[realtime]
# Maximum committed audio segments waiting for Realtime ASR inference.
max_pending_segments = 8

[replica]
# Total hi.cpp process instances, including master instance_id=0. count > 1 enables multi-process mode.
count = 1
# prefer_idle_card, prefer_used_card, or exclusive_card.
device_policy = prefer_idle_card
# Only applies when count > 1. Use exclusive_card policy to force one instance per device.
max_instances_per_device = 2
# When true, worker instances delay model loading by instance_id * startup_delay_sec.
memory_saving = false
startup_delay_sec = 45

[balancer]
enabled = false
management_url = http://127.0.0.1:8085
target_host = 127.0.0.1
heartbeat_interval_ms = 1000

[log]
# Application log level: debug, info, warn, or error.
level = info

# TCIM log level: 1=info, 2=error, 3=warn, 4=debug.
tcim_level = 2
# Number of calendar-day directories to retain, including today.
retention_days = 7
# Maximum parts retained per logger per day. 0 means unlimited.
max_files = 10
# Maximum size of each application and TCIM log part (64K to 1G).
max_file_size = 10M
# Compress closed parts without blocking log writers.
compress_rotated_files = true
# 1 is optimized for low CPU overhead.
compression_level = 1
# Directory used to store application logs on Windows.
location = C:\ProgramData\HoumoAI\HLIECpp\logs\

# Open a console window when running the Windows SDK or demo application.
open_console_window = true

[llm_params]
# Additional llama-server options. Use one complete option per entry in the form --name = value; leave the value empty for flag options.
--jinja =
--reasoning-format = auto
#--reasoning_budget = 0

[model]
# Root directory scanned for model files.
cur_model = D:\models
# Default LLM or Whisper model name without its file extension.
default =
# Default multimodal projector model name without its file extension.
default_mmproj =
# Load the configured Stable Diffusion 3 model by default.
enable_sd3 = false
# Automatically load the model requested by completion or embedding APIs.
auto_load = true
# Periodically detect newly downloaded models. 0 disables the background scan.
discovery_scan_interval_sec = 30
# A changed directory must remain unchanged for this long before GGUF validation.
discovery_stability_sec = 10
# Unknown model lookups may wake discovery; GET /models never triggers discovery.
discovery_scan_on_models_request = false
# Minimum seconds between explicit discovery requests; concurrent requests are coalesced.
discovery_request_cooldown_sec = 5
# Maximum time for an on-demand request to wait for discovery registration.
discovery_request_wait_sec = 15
# Allow idle models to be evicted by memory, count, or idle-time policies.
auto_unload = true
# Idle time in seconds before a model may be evicted; 0 disables TTL eviction.
idle_ttl_sec = 0
# Maximum concurrently loaded models; 0 means unlimited. LRU eviction skips protected models.
max_loaded_models = 0
# Comma-separated model identifiers protected from automatic eviction; values match normalized key, model_name, or meta.name identifiers.
pinned_models =
# The default model is automatically protected from auto eviction.
# Enable lazy loading for LLM models.
llm_lazy_mode = false
# Resolve per-model llama.cpp parameters during model loading.
llm_presets_enabled = true
llm_preset_catalog = model_presets.json
llm_override_catalog = model_overrides.json
# Invalid existing catalogs fail service initialization when true.
llm_preset_strict = true
