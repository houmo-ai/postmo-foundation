[server]
port = 7901
# HOUMO设备ID, 以数字表示，默认只有0，多个设备用逗号隔开, 如 0,1
devices = 0
# 实例副本数量，会启动多个进程，端口会递增+1， 用于负载均衡，多个设备同时运行同一种模型
replicas = 1

[log]
# debug, info, warn, info
level = info

# 4-debug, 3-warn, 2-error 1-info
tcim_level = 2
# max files to keep
max_files = 7
# Just for Windows Mode, Linux Service use fixed path： /opt/HLIECpp/logs
location = C:\ProgramData\HoumoAI\HLIECpp\logs\

# SDK & Demo using
open_console_window = true

[llm_params]
#llama-server的参数透传，请参考下面或者llamacpp的设置, 请使用完整option: --xxx = xx， 没有值的请留空
--jinja =
--reasoning-format = auto
#--reasoning_budget = 0

[model]
# 模型目录
cur_model = D:\models
# 默认LLM/WHISPER模型，不带格式后缀
default =
default_mmproj =
# 是否默认加载SD3
enable_sd3 = false
# 针对LLM配置为true时，相关Completions/Embeddings会根据接口中的model参数去自动加载模型
auto_load = true
# LLM模型懒加载
llm_lazy_mode = false
