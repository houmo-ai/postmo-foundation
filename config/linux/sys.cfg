[server]
port = 7901
# HOUMO设备ID, 以数字表示，默认只有0，多个设备用逗号隔开, 如 0,1
devices = 0
# 实例副本数量，会启动多个进程，端口会递增+1， 用于负载均衡，多个设备同时运行同一种模型
replicas = 1
# 用于多实例场景下节省内存使用，true时多实例的模型加载会有一定时间等待，达成串行效果
memory_saving = false


[log]
# debug, info, warn, info
level = info

# 4-debug, 3-warn, 2-error 1-info
tcim_level = 2
# max files to keep
max_files = 7
# Just for Windows Mode, Linux Service use fixed path： /opt/hicpp/logs
location = /opt/HLIECpp/logs

# SDK & Demo using
open_console_window = true

[llm_params]
#llama-server的参数透传，请参考下面或者llamacpp的设置, 请使用完整option: --xxx = xx， 没有值的请留空
#--jinja =
#--chat-template-file = /opt/houmo/models/qwen3_nonthinking.jinja

[model]
cur_model = /opt/houmo/models