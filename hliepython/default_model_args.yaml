
# 默认模型元信息与 vLLM 启动参数。主要用于动态加载模型时，快速获取模型类型、vLLM 配置等信息。

schema_version: 1

profiles:
  llm: &profile_llm
    model_type: "llm"

  llm_qwen_tool_call: &profile_llm_qwen_tool_call
    model_type: "llm"
    vllm_config:
      serving:
        enable-auto-tool-choice: true
        tool-call-parser: "qwen3_coder"

  llm_qwen_mtp: &profile_llm_qwen_mtp
    model_type: "llm"
    vllm_config:
      engine:
        speculative-config:
          model: ""
          method: "mtp"
          num_speculative_tokens: 5
      serving:
        enable-auto-tool-choice: true
        tool-call-parser: "qwen3_coder"

  llm_gemma_tool_call: &profile_llm_gemma_tool_call
    model_type: "llm"
    vllm_config:
      serving:
        enable-auto-tool-choice: true
        tool-call-parser: "gemma4"

  llm_openai_tool_call: &profile_llm_openai_tool_call
    model_type: "llm"
    vllm_config:
      serving:
        enable-auto-tool-choice: true
        tool-call-parser: "openai"

  asr_dummy_load: &profile_asr_dummy_load
    model_type: "asr"
    vllm_config:
      engine:
        load-format: "dummy"

  asr_forced_aligner: &profile_asr_forced_aligner
    model_type: "asr"
    vllm_config:
      engine:
        load-format: "dummy"
        hf-overrides:
          architectures: ["Qwen3ASRForcedAlignerForTokenClassification"]
        enforce-eager: true
        runner: "pooling"
      serving:
        trust-request-chat-template: true

  embedding: &profile_embedding
    model_type: "embedding"

  reranker_qwen3: &profile_reranker_qwen3
    model_type: "reranker"
    vllm_config:
      engine:
        hf-overrides:
          architectures: ["Qwen3ForSequenceClassification"]
          classifier_from_token: ["no", "yes"]
          is_original_qwen3_reranker: true

  tts: &profile_tts
    model_type: "tts"

