# 服务运行配置
server:
  main_port: 7800
  log_level: "info"
  vllm_log_level: "debug"
  model_root_dir: "/home/useradmin/houmo/models/v1.2.0"

# 服务启动方式
preload_models_on_startup: true  # 改为 false 可只启动服务端，按请求动态加载

# 模型配置
models:
  # Qwen3-8B 模型（多实例）
  - name: "Houmo/Qwen3.5-9B"
    instances:
      - port: 7801
        model_path: "/home/useradmin/houmo/models/v1.2.0/qwen3.5_9B"
        model_type: "text"    # llm、image、asr、tts
        device_ids: [0]
        vllm_extra_config:
          max_model_len: 1024  # 降低最大序列长度以节省内存
          gpu_memory_utilization: 0.2  # 降低GPU内存利用率
          tensor_parallel_size: 1
        extra_config: {}
      - port: 7802
        model_path: "/home/useradmin/houmo/models/v1.2.0/qwen3.5_9B"
        model_type: "text"
        device_ids: [0]
        vllm_extra_config:
          max_model_len: 1024  # 降低最大序列长度以节省内存
          gpu_memory_utilization: 0.2  # 降低GPU内存利用率
          tensor_parallel_size: 1
        extra_config: {}

