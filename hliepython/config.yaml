  # Qwen3-ASR-1.7B 模型
  - model_path: "HiModel_xh2_qwen3_asr_1.7b_1chip_2cores_v1.3.0_20260604.gguf"
    model_type: "asr"
    instances:
      - vllm_config:
          engine:
            load-format: "dummy"
            no-enable-prefix-caching: true
          # serving:
          #   enable-auto-tool-choice: true
          #   tool-call-parser: "qwen3_coder"
          api-server:
            port: 7801
            server-model-name: "Qwen3-ASR-1.7B"
        additional_config:
          "vit_model_name": "mmproj_xh2_qwen3-asr_1.7b_2cores_v1.3.0_20260604.gguf"

  # Qwen3-ForcedAligner-0.6B 模型
  - model_path: "HiModel-Qwen3-ForcedAligner-0.6B-Q4_0.gguf"
    model_type: "forced_aligner"
    instances:
      - vllm_config:
          engine:
            no-enable-prefix-caching: true
            load-format: "dummy"
            max-model-len: 411
            load-format: "dummy"
            hf-overrides:
              architectures: ["Qwen3ASRForcedAlignerForTokenClassification"]
          api-server:
            port: 7802
            server-model-name: "Qwen3-ForcedAligner-0.6B"
        additional_config:
          "vit_model_name": "mmproj-Qwen3-ForcedAligner-Q4_0.gguf"

