# 服务运行配置
server:
  main_port: 7800
  log_level: "info"
  model_root_dir: "/data/useradmin/models/v1.3.0"

# 模型配置
models:
  # Qwen3.5-9B 模型
  - name: "Qwen3.5-9B"
    instances:
      - port: 7801
        model_path: "Qwen3.5-9B"
        model_type: "text"    # text、embedding、asr、tts
        vllm_config:
          engine:
            max-model-len: 65536
            max-num-seqs: 1
            no-enable-prefix-caching: true
            max-num-batched-tokens: 65536
        additional_config:
          device_ids: [0]
          enable_cacheprompt: "False"

