# 服务运行配置
server:
  main_port: 7800
  log_level: "info"
  vllm_log_level: "debug"
  model_root_dir: "/home/useradmin/houmo/models/v1.2.0"

# 服务启动方式
preload_models_on_startup: true  # 改为 false 可只启动服务端，按请求动态加载

# 模型配置
models:
  # Qwen3.5-9B 模型
  - name: "Houmo/Qwen3.5-9B"
    instances:
      - port: 7801
        model_path: "qwen3.5_9B"
        model_type: "text"    # text、image、asr、tts
        vllm_config:
          max-model-len: 65536
          max-num-seqs: 1
          tensor_parallel_size: 1
          no-enable-prefix-caching: true
          max-num-batched-tokens: 65536
        additional_config:
          device_ids: [0]
          enable_cacheprompt: "True"

