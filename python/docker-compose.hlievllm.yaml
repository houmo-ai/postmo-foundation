services:
  hlievllm:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hlievllm_server_container
    privileged: true
    restart: always
    working_dir: /workspace
    volumes:
      - ../models:/workspace/models
    command: >-
      vllm serve /workspace/models
      --port 7801
      --host 0.0.0.0
      --no-enable-prefix-caching
      --served-model-name model-name
      --max-num-batched-tokens 262144
      --max-num-seqs 1
      --max-model-len 262144
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --additional-config '{"visual_model_path":"/workspace/models/mmproj.gguf"}'
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    network_mode: "host"
    pid: host