services:
  hliepython:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hliepython_server_container
    privileged: true
    restart: always
    working_dir: /workspace
    volumes:
      - ./config.yaml:/workspace/config.yaml
      - ../models:/workspace/models
    command:
      - python
      - -m
      - hliepython.main
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    network_mode: "host"
    pid: host