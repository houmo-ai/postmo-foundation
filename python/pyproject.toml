[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hliepython"
version = "3.1.0"
description = "A multi-process multi-instance OpenAI API server"
authors = [
    {name = "HLIEPython Contributors"},
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
    "httpx",
    "loguru",
    "jinja2",
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "regex",
    "tqdm",
    "pillow",
    "torch",
    "torchaudio",
    "transformers",
    "qwen-vl-utils",
    "gguf",
    "inflect",
    "vllm>=0.4.0",
    "openai-whisper",
    "resampy",
    "vllm[audio]",
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["ai", "llm", "inference", "openai", "api", "vllm", "multi-modal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/your-org/hliepython"
Documentation = "https://github.com/your-org/hliepython/blob/master/README.md"
Repository = "https://github.com/your-org/hliepython.git"
Issues = "https://github.com/your-org/hliepython/issues"

[project.scripts]
hliepython = "hliepython.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["hliepython*"]

[tool.setuptools.package-data]
hliepython = [
    "*.yaml",
    "*.yml",
    "model_server/engines/files/*.json",
    "model_server/engines/files/*.wav",
    "model_server/engines/files/audio/*.mp3",
]