services:
  hlievllm:
    image: harbor.houmo.ai/application_software/infer:v3.0.0
    container_name: hlievllm_server_container
    privileged: true
    restart: always
    working_dir: /opt/hlievllm
    volumes:
      - ../models:/opt/hlievllm/models
    command: >-
      vllm serve /opt/hlievllm/models/houmo-model
      --port 7801
      --host 0.0.0.0
      --no-enable-prefix-caching
      --served-model-name houmo-model
      --max-num-batched-tokens 8192
      --max-num-seqs 1
      --max-model-len 8192
      --enable-auto-tool-choice
      --tool-call-parser model_coder
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    network_mode: "host"
    pid: host